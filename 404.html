<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Redirect to home after 10 seconds -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #080c1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container { padding: 2rem; max-width: 600px; }
    .emoji { font-size: 5rem; margin-bottom: 1rem; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    h1 { font-size: 6rem; font-weight: 900; color: #FFD700; line-height: 1; }
    h2 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
    p { color: #aaa; margin-bottom: 2rem; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #FFD700;
      color: #080c1a;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,215,0,0.4); }
    .redirect-note { margin-top: 1.5rem; font-size: 0.85rem; color: #666; }
  </style>
</head>

  <div class="container">
